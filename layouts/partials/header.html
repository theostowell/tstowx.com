<header class="header">
    <nav class="nav">
        <div class="logo">
            <a href="{{ "" | absLangURL }}" accesskey="h" title="{{ site.Title }} (Alt + H)">
                <img src="{{ "/wordmark.png" | absURL }}" alt="Theo Stowell" width="1087" height="198">
            </a>
            <div class="logo-switches">
                {{- if (not site.Params.disableThemeToggle) }}
                <button id="theme-toggle" accesskey="t" title="(Alt + T)">
                    <svg id="moon" xmlns="http://www.w3.org/2000/svg" width="24" height="18" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                    <svg id="sun" xmlns="http://www.w3.org/2000/svg" width="24" height="18" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
                {{- end }}
            </div>
        </div>
        <div class="mobile-menu-controls">
            <button type="button" class="cta-button" data-supascribe-popup-trigger="840405570576" title="Subscribe to Theo's Substack">Subscribe</button>
            <button class="hamburger" id="hamburger" type="button" aria-label="Toggle menu" aria-controls="mobile-menu" aria-expanded="false">
                <span class="hamburger-line"></span><span class="hamburger-line"></span><span class="hamburger-line"></span>
            </button>
        </div>
    </nav>
    <div class="mobile-menu" id="mobile-menu">
        <div class="mobile-menu-inner">
            <a href="https://photos.tstowx.com/" class="mobile-menu-link">Photos</a>
            <a href="https://tstowx.substack.com/" class="mobile-menu-link">Essays</a>
        </div>
    </div>
    <div data-supascribe-embed-id="840405570576" data-supascribe-popup></div>
</header>
<script>
(() => {
  const button = document.getElementById('hamburger');
  const menu = document.getElementById('mobile-menu');
  const header = document.querySelector('.header');
  if (!button || !menu || !header) return;
  const close = () => { button.classList.remove('is-active'); button.setAttribute('aria-expanded', 'false'); menu.classList.remove('is-open'); header.classList.remove('menu-open'); };
  button.addEventListener('click', () => { const open = menu.classList.toggle('is-open'); button.classList.toggle('is-active', open); button.setAttribute('aria-expanded', String(open)); header.classList.toggle('menu-open', open); });
  menu.querySelectorAll('a').forEach(link => link.addEventListener('click', close));
  document.addEventListener('keydown', event => { if (event.key === 'Escape') close(); });
  document.addEventListener('click', event => { if (menu.classList.contains('is-open') && !menu.contains(event.target) && !button.contains(event.target)) close(); });
})();
</script>
