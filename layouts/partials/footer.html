{{- if and (not (.Param "hideFooter")) (ne .Layout "404") }}
<footer class="footer" style="text-align: center; padding-top: 2.5rem;">
    <div class="footer-newsletter-section" style="max-width: 600px; margin: 0 auto;">
        <section class="newsletter-section" style="max-width: 600px; margin: 0 auto; text-align: center;">
            <form
                action="https://buttondown.com/api/emails/embed-subscribe/tstowx"
                method="post"
                target="popupwindow"
                onsubmit="window.open('https://buttondown.com/tstowx', 'popupwindow')"
                class="embeddable-buttondown-form"
                style="margin-bottom: 1.5rem;">
                <label for="bd-email">Sign up for essays and travel reccs...</label>
                <input type="email" name="email" id="bd-email" placeholder="Email address..." />
                <input type="submit" value="Subscribe to updates" />
            </form>
        </section>

        <div style="text-align: center; margin-top: 1.5rem;">
            <span class="copyright" style="color: #888; font-size: 0.95rem;">
                &copy; {{ now.Year }} Theo Stowell
            </span>
        </div>

        {{- if (not site.Params.disableScrollToTop) }}
        <div style="text-align: center; margin-top: 1rem;">
            <a href="#top"
               aria-label="Go to top"
               title="Go to Top (Alt + G)"
               class="top-link"
               id="top-link"
               accesskey="g"
               style="display: inline-block;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 6" fill="currentColor" width="32" height="16">
                    <path d="M12 6H0l6-6z" />
                </svg>
            </a>
        </div>
        {{- end }}
    </footer>
{{- end }}

{{- partial "extend_footer.html" . }}
