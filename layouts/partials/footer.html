{{- if and (not (.Param "hideFooter")) (ne .Layout "404") }}
<footer class="footer" style="text-align: center; padding-top: 2.5rem;">
    <div class="footer-newsletter-section" style="max-width: 600px; margin: 0 auto;">
        <section class="newsletter-section" style="max-width: 600px; margin: 0 auto; text-align: center;">
            <h2 style="margin-bottom: 1.5rem; font-size: 1.5rem; font-weight: 600;">
                Subscribe to the 
                <a href="https://fundamentalised.substack.com/" target="_blank" rel="noopener" style="color: inherit;">
                    Fundamentalised newsletter
                </a>
                ...
            </h2>
            <div id="custom-substack-embed" style="margin-bottom: 0.5rem;"></div>
            <div data-supascribe-embed-id="81241532914" data-supascribe-subscribe style="margin-bottom: 1.5rem;"></div>
        </section>

        <!-- Supascribe Script -->
        <script src="https://js.supascribe.com/v1/loader/0MUY7feAFJOFq9Bm3HsyDx8RKi92.js" async></script>

        <div style="text-align: center; margin-top: 1.5rem;">
            <span class="copyright" style="color: #888; font-size: 0.95rem;">
                &copy; {{ now.Year }} Theo Stowell
            </span>
        </div>

        {{- if (not site.Params.disableScrollToTop) }}
        <div style="text-align: center; margin-top: 1rem;">
            <a href="#top"
               aria-label="Go to top"
               title="Go to Top (Alt + G)"
               class="top-link"
               id="top-link"
               accesskey="g"
               style="display: inline-block;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 6" fill="currentColor" width="32" height="16">
                    <path d="M12 6H0l6-6z" />
                </svg>
            </a>
        </div>
        {{- end }}
    </footer>
{{- end }}

{{- partial "extend_footer.html" . }}
