[build]
  command = "git submodule update --init --recursive && hugo"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.139.1"

[context.production.environment]
  GO_VERSION = "1.23"

[[redirects]]
  from = "/assets/tx/js/pa-Ch8niZdikfyOY2_JeEOrq.js"
  to = "https://stats.parazettel.com/js/pa-Ch8niZdikfyOY2_JeEOrq.js"
  status = 200
  force = true

[[redirects]]
  from = "/assets/tx/api/event"
  to = "https://stats.parazettel.com/api/event"
  status = 200
  force = true

[[redirects]]
  from = "/lnw"
  to = "/lnw/index.html"
  status = 301
  force = true

# Liquid Net Worth is served by the VPS dashboard; Netlify remains the public
# HTTPS front door so the URL stays at tstowx.com/lnw.
[[redirects]]
  from = "/lnw/*"
  to = "http://77.68.98.192/lnw/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/essays/*"
  to = "/:splat"
  status = 301
  force = true

# /timeline/ and /now/ retired: send old inbound links home rather than to a 404.
[[redirects]]
  from = "/timeline"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/timeline/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/now"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/now/*"
  to = "/"
  status = 301
  force = true

# The galleries live here now, at /photos/<gallery>/. Old gallery links keep working; only
# the client projects still forward to the photography site.
[[redirects]]
  from = "/photos/galleries/:gallery"
  to = "/photos/:gallery"
  status = 301
  force = true

[[redirects]]
  from = "/photos/galleries/:gallery/*"
  to = "/photos/:gallery"
  status = 301
  force = true

[[redirects]]
  from = "/photos/projects/*"
  to = "https://photos.tstowx.com/projects/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/fundamentalised"
  to = "https://buttondown.com/tstowx/archive/"
  status = 301
  force = true

[[redirects]]
  from = "/fundamentalised/"
  to = "https://buttondown.com/tstowx/archive/"
  status = 301
  force = true
