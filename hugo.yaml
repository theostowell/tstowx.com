baseURL: 'https://tstowx.com/'
languageCode: 'en-gb'
title: 'Theo Stowell'

module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod

cover:
  image: "/opengraph.png"

params:
  defaultTheme: light
  disableThemeToggle: true
  ShowFullTextinRSS: true
  images: ["/opengraph.png"]
  description: Theo Stowell - Entrepreneur and serial creator
  HomeInfoParams:
    Title: Entrepreneur and serial creator
    Content: |
      I'm Theo - recently graduated (BSc Zoology), now travelling Southeast Asia building [PARAZETTEL](https://parazettel.com), an info-business I started whilst I was studying.

      At the same time as growing the business, I'm writing essays, making videos and sending emails (after discontinuing [Fundamentalised](https://buttondown.com/tstowx/archive/), my newsletter of two-and-a-half years). You can read some of the more polished work on this website, by scrolling below.

      I used to put life updates on this page, but have since designated the [/now](https://tstowx.com/now/) page for this. Check it out for the most recent insights into what I've been doing!
  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/safari-pinned-tab.svg"
  SocialIcons:
    - name: 'LinkedIn'
      url: 'https://www.linkedin.com/in/tstowx'
      icon: 'fab fa-linkedin'
      target: '_blank'
    - name: 'YouTube'
      url: 'https://www.youtube.com/@tstowx'
      icon: 'fab fa-youtube'
      target: '_blank'
    - name: 'Instagram'
      url: 'https://www.instagram.com/tstowx'
      icon: 'fab fa-instagram'
      target: '_blank'
    - name: 'Substack'
      url: 'https://substack.com/@tstowx'
      target: '_blank'
  ShowShareButtons: false
  ShowPostNavLinks: false
  ShowReadingTime: true
  ShowBreadCrumbs: true
  ScrollToTop: false
  mainSections:
    - writing
  customCSS:
    - css/extended/custom.css
  env: production

menu:
  main:
    - name: "Writing"
      url: "/writing"
      weight: 1
    - name: "Photos"
      url: "/photos"
      weight: 2
    - name: "Signup"
      url: "/signup"
      weight: 3

privacy:
  x:
    disable: false
    enableDNT: false
    simple: true
  youTube:
    disable: false
    privacyEnhanced: true
  

outputs:
  home:
    - HTML
    - RSS
  section:
    - HTML
    - RSS

markup:
  goldmark:
    renderer:
      unsafe: true
