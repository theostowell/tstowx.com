baseURL: 'https://theostowell.me/'
languageCode: 'en-gb'
title: 'Theo Stowell'
theme: PaperMod

cover:
  image: "/opengraph.png"

params:
  defaultTheme: light
  disableThemeToggle: true
  ShowFullTextinRSS: true
  images: ["/opengraph.png"]
  description: "Theo Stowell is a writer and entrepreneur based in Reading, UK. On this site you can find an intro, short essays, links to services and products, and more..."
  HomeInfoParams:
    Title: I'm Theo–a writer and entrepreneur based in Reading, UK
    Content: |
      Things are changing around here. You might have noticed the new branding and domain. Fundamentalised will live on though, just bear with me as I make the changes. You can still sign up in the footer. 
      ***NOTE**: I'm not writing or recording new issues right now. Go to [theostowell.me/hiatus](https://theostowell.me/hiatus) to learn more*...
  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/safari-pinned-tab.svg"
  SocialIcons:
    - name: 'X'
      url: 'https://x.com/fundamentalised'
      icon: 'fab fa-x'
      target: '_blank'
    - name: 'LinkedIn'
      url: 'https://www.linkedin.com/in/theostowell'
      icon: 'fab fa-linkedin'
      target: '_blank'
  ShowShareButtons: false
  ShowPostNavLinks: false
  ShowReadingTime: true
  ShowBreadCrumbs: true
  ScrollToTop: false
  mainSections:
    - essays
  customCSS:
    - css/extended/custom.css
  env: production

googleAnalytics: "G-4ZDR7MYMS3"

menu:
  main:
    - name: "About"
      url: "/about/"
      weight: 1
    - name: "Services"
      url: "/services/"
      weight: 2
    - name: "Writing"
      url: "/essays/"
      weight: 3
    - name: "Newsletter"
      url: "https://www.fundamentalised.com/"
      weight: 4

privacy:
  x:
    disable: false
    enableDNT: false
    simple: true
  youTube:
    disable: false
    privacyEnhanced: true
  

outputs:
  home:
    - HTML
    - RSS
  section:
    - HTML
    - RSS

markup:
  goldmark:
    renderer:
      unsafe: true