baseURL: "https://tstowx.com/"
languageCode: "en-gb"
title: "Theo Stowell"

module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod

cover:
  image: "/opengraph.png"

params:
  defaultTheme: light
  disableThemeToggle: true
  ShowFullTextinRSS: true
  images: ["/opengraph.png"]
  description: Theo Stowell - Entrepreneur and serial creator
  HomeInfoParams:
    Title: Part entrepreneur, part starving artist
    Content: |
      **APRIL 2026:** I'm Theo - an entrepreneur and creative. Last summer, I graduated BSc Zoology from the University of Sheffield in the UK. Instead of pursuing a career, I chose the growth of [PARAZETTEL](https://parazettel.com), an info business I started whilst studying.

      I travelled for the last six months, around Asia and Australia, but now I'm back in the UK, ready to scale PARAZETTEL to the point where near-permanent travel is a reality. I've also started a second internet business, a web app called [ProseLab](https://www.proselab.io) with Luca, a friend I made whilst living in Vietnam.

      This is my living timeline: writing, trips, projects and the things worth keeping. Photography work lives separately at [photos.tstowx.com](https://photos.tstowx.com); for the most up-to-date and deepest view into my mind, head over to my [Substack](https://substack.com/@tstowx) and subscribe there!
  timelineHome:
    title: "Theo Stowell. Part entrepreneur, part starving artist."
    content: |
      Welcome to my personal site -- I've tried to make it a 'digital CV' as such. I don't discriminate across the work that I post here, all of it is stuff I'm proud of, for whatever reason, ordered in a chronological timeline. Have a scroll through...

      <I>Looking to hire me to shoot photos of your venue or at your next event? [There's a dedicated portfolio for that which you can find here.](https://photos.tstowx.com)</I>
  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/safari-pinned-tab.svg"
  SocialIcons:
    - name: "Substack"
      url: "https://substack.com/@tstowx"
      target: "_blank"
    - name: "Instagram"
      url: "https://www.instagram.com/tstowx"
      icon: "fab fa-instagram"
      target: "_blank"
    - name: "YouTube"
      url: "https://www.youtube.com/@tstowx"
      icon: "fab fa-youtube"
      target: "_blank"
    - name: "LinkedIn"
      url: "https://www.linkedin.com/in/tstowx"
      icon: "fab fa-linkedin"
      target: "_blank"
  ShowShareButtons: false
  ShowPostNavLinks: false
  ShowReadingTime: true
  ShowBreadCrumbs: true
  ScrollToTop: false
  mainSections:
    - writing
  customCSS:
    - css/extended/custom.css
  env: production

menu:
  main:
    - name: "Writing"
      url: "/writing"
      weight: 1
    - name: "Photography"
      url: "https://photos.tstowx.com"
      weight: 2
    - name: "Businesses"
      url: "https://trustmrr.com/founder/theostowell"
      weight: 3

privacy:
  x:
    disable: false
    enableDNT: false
    simple: true
  youTube:
    disable: false
    privacyEnhanced: true

outputs:
  home:
    - HTML
    - RSS
  section:
    - HTML
    - RSS

markup:
  goldmark:
    renderer:
      unsafe: true
