baseURL: 'https://wip.fundamentalised.com/'
languageCode: 'en-gb'
title: 'Fundamentalised'
theme: PaperMod

params:
  defaultTheme: light
  disableThemeToggle: true
  HomeInfoParams:
    Title: Hi, I'm Theo Stowell, and welcome to Fundamentalised
    Content: "This is a site all about breaking the hard things in life down into their fundamentals, because often this is what we're missing, rather than something new and complex."
  SocialIcons:
    - name: 'Medium'
      url: 'https://medium.com/@fundamentalised'
      icon: 'fab fa-medium'
      target: '_blank'
    - name: 'Twitter'
      url: 'https://twitter.com/fundamentalised'
      icon: 'fab fa-twitter'
      target: '_blank'
    - name: 'YouTube'
      url: 'https://youtube.com/@fundamentalised'
      icon: 'fab fa-youtube'
      target: '_blank'
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowReadingTime: true
  ShowBreadCrumbs: true
  ScrollToTop: false
  mainSections:
    - essays
    - issues
  customCSS:
    - css/extended/custom.css
  label:
    icon: "logo-header.png"
    iconHeight: 60
    text: ""

menu:
  main:
    - name: "Now"
      url: "/now/"
      weight: 1
    - name: "Newsletter"
      url: "/issues/"
      weight: 2
    - name: "Essays"
      url: "/essays/"
      weight: 3

module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod

markup:
  goldmark:
    renderer:
      unsafe: true