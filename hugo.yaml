baseURL: 'https://fundamentalised.com/'
languageCode: 'en-gb'
title: 'Fundamentalised by Theo Stowell'
theme: PaperMod

cover:
  image: "/og-image.png"

params:
  defaultTheme: light
  disableThemeToggle: true
  ShowFullTextinRSS: true
  images: ["/og-image.png"]
  description: "Reversing entropy; mastering life's fundamentals • Join Theo Stowell in figuring out and making the most of the core elements (fundamentals) of the human experience..."
  HomeInfoParams:
    Title: I'm Theo Stowell, and this is Fundamentalised
    Content: |
      ***Reversing entropy; mastering life's fundamentals*** • I find myself re-learning lessons in life, so I began to prioritise getting the basics (fundamentals) right. And I've been writing about it the whole way...
  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/safari-pinned-tab.svg"
  SocialIcons:
    - name: 'Medium'
      url: 'https://medium.com/@fundamentalised'
      icon: 'fab fa-medium'
      target: '_blank'
    - name: 'X'
      url: 'https://x.com/fundamentalised'
      icon: 'fab fa-x'
      target: '_blank'
    - name: 'YouTube'
      url: 'https://youtube.com/@fundamentalised'
      icon: 'fab fa-youtube'
      target: '_blank'
  ShowShareButtons: false
  ShowPostNavLinks: false
  ShowReadingTime: true
  ShowBreadCrumbs: true
  ScrollToTop: false
  mainSections:
    - essays
    - issues
  customCSS:
    - css/extended/custom.css
  env: production

menu:
  main:
    - name: "About"
      url: "/about/"
      weight: 1
    - name: "Newsletter"
      url: "/issues/"
      weight: 2
    - name: "Essays"
      url: "/essays/"
      weight: 3
    - name: "Subscribe"
      url: "/subscribe/"
      weight: 4

privacy:
  x:
    disable: false
    enableDNT: false
    simple: true
  youTube:
    disable: false
    privacyEnhanced: true
  

outputs:
  home:
    - HTML
    - RSS
  section:
    - HTML
    - RSS

markup:
  goldmark:
    renderer:
      unsafe: true