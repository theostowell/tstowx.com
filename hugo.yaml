baseURL: 'https://theostowell.me/'
languageCode: 'en-gb'
title: 'Theo Stowell'
theme: PaperMod

cover:
  image: "/opengraph.png"

params:
  defaultTheme: light
  disableThemeToggle: true
  ShowFullTextinRSS: true
  images: ["/opengraph.png"]
  description: "Theo Stowell is a content/copy writer, photographer and marketer based in Bristol, UK. On this site you can find an intro, short essays, links to services and products, and more..."
  HomeInfoParams:
    Title: I'm Theo–an entrepreneur and creator from Bristol, UK, about to travel Southeast Asia
    Content: |
      For the last three years I've worked on projects like [PARAZETTEL](https://parazettel.com/?utm_source=theostowell.me&utm_medium=referral) and [Fundamentalised](https://fundamentalised.com/), using writing to educate and grow an audience.
      
      I've also been shooting photos and video from a very young age and continue to do this now, largely in the capacity of commercial establishment and event photography. Although I still maintain my love for wildlife and landscape.

      Here is some more text to fill the space.
  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/safari-pinned-tab.svg"
  SocialIcons:
    - name: 'X'
      url: 'https://x.com/fundamentalised'
      icon: 'fab fa-x'
      target: '_blank'
    - name: 'LinkedIn'
      url: 'https://www.linkedin.com/in/theostowell'
      icon: 'fab fa-linkedin'
      target: '_blank'
    - name: 'YouTube'
      url: 'https://www.youtube.com/@theostowell'
      icon: 'fab fa-youtube'
      target: '_blank'
    - name: 'Instagram'
      url: 'https://www.instagram.com/theostowell'
      icon: 'fab fa-instagram'
      target: '_blank'
  ShowShareButtons: false
  ShowPostNavLinks: false
  ShowReadingTime: true
  ShowBreadCrumbs: true
  ScrollToTop: false
  mainSections:
    - essays
  customCSS:
    - css/extended/custom.css
  env: production

googleAnalytics: "G-4ZDR7MYMS3"

menu:
  main:
    - name: "About"
      url: "/about/"
      weight: 1
    - name: "Services"
      url: "/services/"
      weight: 2
    - name: "Essays"
      url: "/essays/"
      weight: 3
    - name: "Newsletter"
      url: "https://www.fundamentalised.com/"
      weight: 4

privacy:
  x:
    disable: false
    enableDNT: false
    simple: true
  youTube:
    disable: false
    privacyEnhanced: true
  

outputs:
  home:
    - HTML
    - RSS
  section:
    - HTML
    - RSS

markup:
  goldmark:
    renderer:
      unsafe: true
