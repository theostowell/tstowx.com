baseURL: "https://tstowx.com/"
languageCode: "en-gb"
title: "Theo Stowell"

module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod

cover:
  image: "/opengraph.png"

params:
  defaultTheme: light
  disableThemeToggle: true
  ShowFullTextinRSS: true
  images: ["/opengraph.png"]
  description: Theo Stowell - Entrepreneur and serial creator
  HomeInfoParams:
    Title: Part entrepreneur, part starving artist
    Content: |
      **APRIL 2026:** I'm Theo - an entrepreneur and creative. Last summer, I graduated BSc Zoology from the University of Sheffield in the UK. Instead of pursuing a career, I chose the growth of [PARAZETTEL](https://parazettel.com), an info business I started whilst studying.

      I travelled for the last six months, around Asia and Australia, but now I'm back in the UK, ready to scale PARAZETTEL to the point where near-permanent travel is a reality. I've also started a second internet business, a web app called [ProseLab](https://www.proselab.io) with Luca, a friend I made whilst living in Vietnam.

      This is my living timeline: writing, trips, projects and the things worth keeping. Photography work lives separately at [photos.tstowx.com](https://photos.tstowx.com); for the most up-to-date and deepest view into my mind, head over to my [Substack](https://substack.com/@tstowx) and subscribe there!
  # The homepage dashboard (layouts/partials/home_dashboard.html).
  # Ventures come from featured project notes with `trustmrr_embed` set;
  # films, writing and the archive are pulled from timeline notes automatically.
  dashboard:
    title: "Part entrepreneur, *part starving artist\\.\\.\\.*"
    intro: |
      I'm Theo, a Zoology graduate who chose to build internet businesses instead of a career. I run [PARAZETTEL](https://parazettel.com), an education business about thinking and note-taking, and I'm building [ProseLab](https://www.proselab.io) with Luca. In between, I write, make films and take photographs.
    status: "UK-based (for now), scaling PARAZETTEL and ProseLab through Q4 and into the new year, before relocation. Considering Vietnam or South Korea for early 2027."
    # The Now tile shows "City, CC · local time", pulled live from this nomads.com
    # profile. `location` is shown until that loads (or if it can't). The clock uses
    # `timezone`, so it only shows while Nomads puts you in `homeCountry`.
    nomads: "tstowx"
    location: "Bristol, UK"
    timezone: "Europe/London"
    homeCountry: "UK"
    # Platforms from SocialIcons (below) to leave out of the homepage Socials tile.
    hiddenSocials: ["LinkedIn"]
    photography:
      url: "https://photos.tstowx.com"
      blurb: "Sport, hospitality, travel and independent brands, in the UK and worldwide. Available for hire."
      images:
        - "/attachments/home/photo-bbu.webp"
        - "/attachments/home/photo-hkg-mac-china.webp"
        - "/attachments/home/photo-raly-iv.webp"
        - "/attachments/home/photo-pipers.webp"
  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/safari-pinned-tab.svg"
  SocialIcons:
    - name: "Substack"
      url: "https://substack.com/@tstowx"
      target: "_blank"
    - name: "Instagram"
      url: "https://www.instagram.com/tstowx"
      icon: "fab fa-instagram"
      target: "_blank"
    - name: "YouTube"
      url: "https://www.youtube.com/@tstowx"
      icon: "fab fa-youtube"
      target: "_blank"
    - name: "LinkedIn"
      url: "https://www.linkedin.com/in/tstowx"
      icon: "fab fa-linkedin"
      target: "_blank"
  ShowShareButtons: false
  ShowPostNavLinks: false
  ShowReadingTime: true
  ShowBreadCrumbs: false
  ScrollToTop: false
  mainSections:
    - writing
  customCSS:
    - css/extended/custom.css
  env: production

menu:
  main:
    - name: "Writing"
      url: "https://tstowx.substack.com"
      weight: 1
    - name: "Photography"
      url: "https://photos.tstowx.com"
      weight: 2
    - name: "Businesses"
      url: "https://trustmrr.com/founder/theostowell"
      weight: 3

privacy:
  x:
    disable: false
    enableDNT: false
    simple: true
  youTube:
    disable: false
    privacyEnhanced: true

# Every note is an index entry: the writing lives on Substack, films on
# YouTube, posts on X. The layout templates send readers to those homes, and
# this extra output renders the same mapping as real 301s in _redirects, which
# Netlify applies before it serves anything.
mediaTypes:
  text/netlify:
    delimiter: ""
    suffixes: [""]

outputFormats:
  redirects:
    mediaType: text/netlify
    baseName: "_redirects"
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - HTML
    - RSS
    - redirects
  section:
    - HTML
    - RSS

markup:
  goldmark:
    renderer:
      unsafe: true
