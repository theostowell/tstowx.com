baseURL: 'https://theostowell.me/'
languageCode: 'en-gb'
title: 'Theo Stowell'
theme: PaperMod

cover:
  image: "/opengraph.png"

params:
  defaultTheme: light
  disableThemeToggle: true
  ShowFullTextinRSS: true
  images: ["/opengraph.png"]
  description: "Theo Stowell is a content/copy writer, photographer and marketer based in Bristol, UK. On this site you can find an intro, short essays, links to services and products, and more..."
  HomeInfoParams:
    Title: I'm Theo–an entrepreneur and creator from the UK
    Content: |
      For three years, I've built projects like [PARAZETTEL](https://parazettel.com/?utm_source=theostowell.me&utm_medium=referral) (teaching knowledge management and productivity) and [Fundamentalised](https://fundamentalised.com/?utm_source=theostowell.me&utm_medium=referral) (documenting my journey), growing audiences through writing, whilst completing my BSc in Zoology at Sheffield University.
      
      This September, I've got a flight booked to Thailand. The goal is to scale my businesses and connect with others doing similar work, taking advantage of Southeast Asia's strong remote work culture.
      
      I've also been [shooting photos and video](https://tstowphoto.com?utm_source=theostowell.me&utm_medium=referral) since childhood. Now it's mainly for commercial venues and events, though I still pursue wildlife, landscape, and urban photography when possible.

      I'm documenting this journey through the [Fundamentalised newsletter](https://fundamentalised.com?utm_source=theostowell.me&utm_medium=referral). Subscribe by going to the link or just give your email in the entry form below.

      This is my first trip outside Europe and my business is still in the very early stages of growing, but I'm excited to experience new things and see where it leads.

      -- Theo
