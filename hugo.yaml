baseURL: 'https://fundamentalised.com/'
languageCode: 'en-gb'
title: 'Fundamentalised by Theo Stowell'
theme: PaperMod

params:
  defaultTheme: light
  disableThemeToggle: true
  HomeInfoParams:
    Title: I'm Theo Stowell, and this is Fundamentalised (SITE IS WIP)
    Content: |
      "*Reversing entropy; mastering life's fundamentals* -- I found that I was learning the same lessons again and again in life. So I decided to focus on mastering these fundamentals rather than getting caught up in complexity. 
      
      This website is the best place to follow this journey as it develops. It's still a work in progress as of right now, but I'm working on getting it up and running as fast as I can..."
  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/safari-pinned-tab.svg"
  cover:
    image: "/og-image.png"
  SocialIcons:
    - name: 'Medium'
      url: 'https://medium.com/@fundamentalised'
      icon: 'fab fa-medium'
      target: '_blank'
    - name: 'X'
      url: 'https://x.com/fundamentalised'
      icon: 'fab fa-x'
      target: '_blank'
    - name: 'YouTube'
      url: 'https://youtube.com/@fundamentalised'
      icon: 'fab fa-youtube'
      target: '_blank'
  ShowShareButtons: false
  ShowPostNavLinks: false
  ShowReadingTime: true
  ShowBreadCrumbs: true
  ScrollToTop: false
  mainSections:
    - essays
    - issues
  customCSS:
    - css/extended/custom.css
  env: production

menu:
  main:
    - name: "Now"
      url: "/now/"
      weight: 1
    - name: "Newsletter"
      url: "/issues/"
      weight: 2
    - name: "Essays"
      url: "/essays/"
      weight: 3

outputs:
  home:
    - HTML
    - RSS
  section:
    - HTML
    - RSS

markup:
  goldmark:
    renderer:
      unsafe: true