theme: PaperMod

cover:
  image: "/opengraph.png"

params:
  defaultTheme: light
  disableThemeToggle: true
  ShowFullTextinRSS: true
  images: ["/opengraph.png"]
  description: "Theo Stowell is a content/copy writer, photographer and marketer based in Bristol, UK. On this site you can find an intro, short essays, links to services and products, and more..."
  HomeInfoParams:
    Title: I'm Theo–an entrepreneur and creator from the UK
    Content: |
      For the last three years l've worked on projects like PARAZETTEL and Fundamentalised, using writing to educate and grow an audience.

      At the same time I was studying at the University of Sheffield, for a BSc in Zoology. Recently I graduated, and have booked a flight to Thailand for this September. 

      The goal out in Asia is to connect with people that will help me scale my businesses, feeding off the strong entrepreneurship and remote work culture that can be found there.

      I've also been shooting photos and video from a very young age and continue to do this now, largely for commercial venues and events. 

      Although I still maintain my love for wildlife, landscape and urban photography in general, and continue to shoot these whenever I get the chance.

      I'm documenting this entire journey (and have been) in the Fundamentalised newsletter and will continue to tell the story whilst I'm travelling and working. If it's something you want keep up with, you can go directly to the newsletter, or supply your email in the entry box at the footer of this page.

      Looking forward, I'm not sure how things are going to go. I've not travelled outside of Europe before, and my business isn't at a massive scale. But it's going to be interesting, and I'll learn a lot.

      -- Theo
