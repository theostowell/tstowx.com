baseURL: 'https://tstowx.com/'
languageCode: 'en-gb'
title: 'Theo Stowell'

module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod

cover:
  image: "/opengraph.png"

params:
  defaultTheme: light
  disableThemeToggle: true
  ShowFullTextinRSS: true
  images: ["/opengraph.png"]
  description: "Theo Stowell is a content/copy writer, photographer and marketer based in Bristol, UK. On this site you can find an intro, short essays, links to services and products, and more..."
  HomeInfoParams:
    Title: I'm Theo–a serial creator and entrepreneur from the UK, now living and travelling in Southeast Asia
    Content: |
      For three years, I've built projects like [PARAZETTEL](https://parazettel.com/?utm_source=tstowx.com&utm_medium=referral) (teaching note-taking and productivity) and [Fundamentalised](https://fundamentalised.com/?utm_source=tstowx.com&utm_medium=referral) (documenting progress and lessons), growing an online audience through writing, whilst completing my BSc in Zoology at the University of Sheffield.
      
      And this summer I graduated, so in September, I jumped on a one-way flight to Thailand. 
      
      As of writing this (5th October 2025), I'm still here. The goal is to scale my businesses and connect with others doing similar things, taking advantage of Southeast Asia's strong remote work culture.
      
      I've also been [shooting photos and video](https://tstowphoto.com?utm_source=tstowx.com&utm_medium=referral) since childhood. Now it's mainly for venues and events, though I still pursue wildlife and landscape photography (my first creative loves) when possible. 
      
      Out here, though, it's more city life and other street topics that gain the most of my attention.

      This journey's most comprehensive documentation will be in the [Fundamentalised newsletter (now travel blog really)](https://fundamentalised.com?utm_source=tstowx.com&utm_medium=referral). 
      
      Subscribe by going to the link or just give your email in the entry form at the bottom of this page. You can also go to the socials for shorter stuff - I've started posting reels (infrequently) on Instagram, and have been trying to keep a few other places updated now and again too.

      This is my first trip outside Europe and my business is still in the very early stages of growing, but I'm excited to experience new things and see where it leads. 
      
      Come along for the ride! It's not going to be easy, but I'll learn a lot, and will share it all with you.

      –– Theo

      **P.S.** *My next stops are Vietnam at the end of October, then onwards to Indonesia, maybe spending Christmas and New Year in Australia (business success-dependent)*.
