baseURL: 'https://tstowx.com/'
languageCode: 'en-gb'
title: 'Theo Stowell'

module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod

cover:
  image: "/opengraph.png"

params:
  defaultTheme: light
  disableThemeToggle: true
  ShowFullTextinRSS: true
  images: ["/opengraph.png"]
  description: "Theo Stowell is a content/copy writer, photographer and marketer based in Bristol, UK. On this site you can find an intro, short essays, links to services and products, and more..."
  HomeInfoParams:
    Title: Entrepreneur and serial creator
    Content: |
      I'm Theo - recently graduated (BSc Zoology), now travelling Southeast Asia building PARAZETTEL, an info-business I started at the same time as studying the degree.

      Now, at the same time as growing the business, I'm writing essays, making videos and sending emails (after discontinuing [Fundamentalised](https://tstowx.com/fundamentalised), my newsletter of two-and-a-half years). You can read some of the more polished work on this website, by scrolling below.

      I used to put life updates on this page, but have since designated the [/now](https://tstowx.com/now/) page for this. Check it out for the most recent insights into what I've been doing!
  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/safari-pinned-tab.svg"
  SocialIcons:
    - name: 'X'
      url: 'https://x.com/fundamentalised'
      icon: 'fab fa-x'
      target: '_blank'
    - name: 'LinkedIn'
      url: 'https://www.linkedin.com/in/theostowell'
      icon: 'fab fa-linkedin'
      target: '_blank'
    - name: 'YouTube'
      url: 'https://www.youtube.com/@theostowell'
      icon: 'fab fa-youtube'
      target: '_blank'
    - name: 'Instagram'
      url: 'https://www.instagram.com/theostowell'
      icon: 'fab fa-instagram'
      target: '_blank'
  ShowShareButtons: false
  ShowPostNavLinks: false
  ShowReadingTime: true
  ShowBreadCrumbs: true
  ScrollToTop: false
  mainSections:
    - essays
  customCSS:
    - css/extended/custom.css
  env: production

googleAnalytics: "G-4ZDR7MYMS3"

menu:
  main:
    - name: "/now"
      url: "/now"
      weight: 1
    - name: "Essays"
      url: "/essays"
      weight: 2
    - name: "Portfolio"
      url: "https://tstowphoto.com"
      weight: 3
    - name: "PARAZETTEL"
      url: "https://parazettel.com"
      weight: 4

privacy:
  x:
    disable: false
    enableDNT: false
    simple: true
  youTube:
    disable: false
    privacyEnhanced: true
  

outputs:
  home:
    - HTML
    - RSS
  section:
    - HTML
    - RSS

markup:
  goldmark:
    renderer:
      unsafe: true
