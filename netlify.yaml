build:
  command: git submodule update --init --recursive && hugo
  publish: public
  environment:
    HUGO_VERSION: 0.139.1


context:
  production:
    environment:
      GO_VERSION: "1.23"

redirects:
  # Mirror netlify.toml for tooling that reads the YAML configuration.
  # All photography routes now resolve on photos.tstowx.com.
  - from: /photos
    to: https://photos.tstowx.com/
    status: 301
    force: true
  - from: /photos/
    to: https://photos.tstowx.com/
    status: 301
    force: true
  - from: /photos/*
    to: https://photos.tstowx.com/:splat
    status: 301
    force: true
  - from: /assets/tx/js/pa-Ch8niZdikfyOY2_JeEOrq.js
    to: https://stats.parazettel.com/js/pa-Ch8niZdikfyOY2_JeEOrq.js
    status: 200
    force: true
  - from: /assets/tx/api/event
    to: https://stats.parazettel.com/api/event
    status: 200
    force: true
  - from: /essays/*
    to: /:splat
    status: 301
    force: true
  - from: /fundamentalised
    to: https://buttondown.com/tstowx/archive/
    status: 301
    force: true
  - from: /fundamentalised/
    to: https://buttondown.com/tstowx/archive/
    status: 301
    force: true
